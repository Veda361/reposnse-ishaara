          description: Validation Error / Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '401':
          description: Unauthorized - Missing or expired session token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '403':
          description: Forbidden - Insufficient permissions or wrong role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
      security:
      - bearerAuth: []
      parameters:
      - name: token
        in: query
        required: false
        description: Bearer session token query parameter
        schema:
          type: string
          example: '{{accessToken}}'
      - name: Upgrade
        in: header
        required: true
        description: HTTP upgrade to WebSocket protocol
        schema:
          type: string
          example: websocket
      - name: Connection
        in: header
        required: true
        description: Connection header
        schema:
          type: string
          example: Upgrade
