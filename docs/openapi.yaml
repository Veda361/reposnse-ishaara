openapi: 3.1.0
info:
  title: Ishara Backend API
  description: Production API specification for Ishara - Smart Campus & Urban Public
    Transit Platform. Includes Ride Sharing, Real-time GPS Tracking, Voice-First Driver
    Trip Drafts, Dynamic Detour Matching, SOS Safety System, Split Payments with Ledger,
    and FCM Notifications.
  version: 1.0.0
  contact:
    name: Ishara Engineering Team
servers:
- url: http://localhost:5000
  description: Local Development Server
- url: https://ishara-backend.onrender.com
  description: Production Server (Render)
tags:
- name: Health
  description: Platform health check and probe endpoints
- name: Authentication
  description: Better Auth Google Social & ID token sign-in endpoints
- name: Users
  description: Passenger profile, role onboarding, and emergency contacts
- name: Drivers
  description: Driver profile, GPS telemetry ingestion, online/offline status, earnings
- name: Vehicles
  description: Fleet vehicle registration, activation, and management
- name: Operators
  description: Bus fleet operators and bank payout verification
- name: Locations
  description: Places search, geocoding, and landmark resolution
- name: Trips
  description: Scheduled & active driver trips across transit corridors
- name: Voice
  description: Voice trip drafting, audio transcription, and realtime speech sessions
- name: Discovery
  description: 6-dimension spatial matching and corridor discovery for passenger journeys
- name: Ride Requests
  description: Trip booking requests, passenger cancel, driver accept/reject
- name: Rides
  description: Active ride execution lifecycle, boardings, arrivals, and live progress
    ETA
- name: Ratings
  description: Passenger-to-driver rating submissions and aggregate review scores
- name: Safety & SOS
  description: Emergency SOS triggers, active incident monitors, and event cancellation
- name: Notifications
  description: In-app notifications, badge counts, and read status management
- name: Devices
  description: FCM push notification device registration and token lifecycle
- name: Payments
  description: Razorpay order creation, signature verification, refunds, and settlements
- name: Surveys
  description: Campus transportation survey collection for empirical research
- name: Admin & Analytics
  description: Administrative overview metrics and raw CSV survey export
- name: Realtime WebSockets
  description: Bidirectional WebSocket streaming channels
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT / Better-Auth-Session
      description: Authenticate requests using active Better Auth session Bearer token
    adminKeyAuth:
      type: apiKey
      in: header
      name: x-admin-key
      description: Administrative secret key header for sensitive management routes
    razorpayWebhookAuth:
      type: apiKey
      in: header
      name: x-razorpay-signature
      description: HMAC-SHA256 signature generated by Razorpay Webhook Engine
  schemas:
    StandardSuccessResponse:
      type: object
      required:
      - success
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          description: Domain response payload
        message:
          type: string
          example: Operation completed successfully
    StandardErrorResponse:
      type: object
      required:
      - success
      - error
      properties:
        success:
          type: boolean
          example: false
        error:
          type: object
          required:
          - code
          - message
          properties:
            code:
              type: string
              example: UNAUTHORIZED
            message:
              type: string
              example: Authentication required
            details:
              type: object
paths:
  /:
    get:
      tags:
      - Health
      summary: Root container orchestrator probe
      description: Returns basic service name and health pointer for container orchestrator
        liveness detection.
      operationId: get
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  name:
                    type: string
                    example: isahara-backend
                  health:
                    type: string
                    example: /api/v1/health
        '400':
          description: Validation Error / Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
      security: []
  /health:
    get:
      tags:
      - Health
      summary: Unthrottled health probe
      description: Returns status healthy or degraded based on active MongoDB connectivity
        state.
      operationId: get__health
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                    - healthy
                    - degraded
                    example: healthy
                  database:
                    type: string
                    enum:
                    - connected
                    - disconnected
                    example: connected
                  environment:
                    type: string
                    example: development
                  timestamp:
                    type: string
                    format: date-time
                  uptime:
                    type: integer
                    example: 120
        '400':
          description: Validation Error / Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
      security: []
  /healthz:
    get:
      tags:
      - Health
      summary: Kubernetes / cloud liveness check
      description: Alias for /health without route rate limiting for container uptime
        monitors.
      operationId: get__healthz
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardSuccessResponse'
        '400':
          description: Validation Error / Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
      security: []
  /api/v1/health:
    get:
      tags:
      - Health
      summary: Versioned API health inspection
      description: Canonical versioned health check route verifying backend status
        and database readiness.
      operationId: get__api_v1_health
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardSuccessResponse'
        '400':
          description: Validation Error / Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
      security: []
  /api/auth/sign-in/social:
    post:
      tags:
      - Authentication
      summary: Google OAuth and native Android Google Sign-In
      description: Verifies Google ID tokens issued for configured Web or Android
        Client IDs, automatically provisioning or authenticating the user account.
      operationId: post__api_auth_sign_in_social
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardSuccessResponse'
        '400':
          description: Validation Error / Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              example:
                provider: google
                idToken: eyJhbGciOiJSUzI1NiIsImtpZCI...
  /api/auth/sign-out:
    post:
      tags:
      - Authentication
      summary: Sign out active session
      description: Revokes the active Better Auth session matching the Bearer token
        or session cookie.
      operationId: post__api_auth_sign_out
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardSuccessResponse'
        '400':
          description: Validation Error / Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '401':
          description: Unauthorized - Missing or expired session token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '403':
          description: Forbidden - Insufficient permissions or wrong role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
      security:
      - bearerAuth: []
  /api/auth/get-session:
    get:
      tags:
      - Authentication
      summary: Resolve authenticated session details
      description: Returns current session payload and associated Google OAuth identity
        if authenticated.
      operationId: get__api_auth_get_session
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardSuccessResponse'
        '400':
          description: Validation Error / Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '401':
          description: Unauthorized - Missing or expired session token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '403':
          description: Forbidden - Insufficient permissions or wrong role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
      security:
      - bearerAuth: []
  /api/auth/ok:
    get:
      tags:
      - Authentication
      summary: Better Auth server status
      description: Verifies that the Better Auth subsystem is operational.
      operationId: get__api_auth_ok
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardSuccessResponse'
        '400':
          description: Validation Error / Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
      security: []
  /api/v1/users/me:
    get:
      tags:
      - Users
      summary: Retrieve authenticated user profile
      description: Retrieves the application user record matching the authenticated
        Better Auth caller.
      operationId: get__api_v1_users_me
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardSuccessResponse'
        '400':
          description: Validation Error / Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '401':
          description: Unauthorized - Missing or expired session token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '403':
          description: Forbidden - Insufficient permissions or wrong role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
      security:
      - bearerAuth: []
    patch:
      tags:
      - Users
      summary: Update editable profile fields
      description: Updates passenger name, phone number, or avatar image URL. Tampering
        with role or security flags is strictly prohibited.
      operationId: patch__api_v1_users_me
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardSuccessResponse'
        '400':
          description: Validation Error / Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '401':
          description: Unauthorized - Missing or expired session token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '403':
          description: Forbidden - Insufficient permissions or wrong role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              example:
                name: Aarav Sharma
                phoneNumber: '+919876543210'
                image: https://example.com/avatar.jpg
  /api/v1/users/me/onboarding:
    post:
      tags:
      - Users
      summary: Select primary user role during onboarding
      description: Assigns user role as USER (passenger) or DRIVER_CONDUCTOR. Can
        only be invoked once when onboardingCompleted is false.
      operationId: post__api_v1_users_me_onboarding
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardSuccessResponse'
        '400':
          description: Validation Error / Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '401':
          description: Unauthorized - Missing or expired session token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '403':
          description: Forbidden - Insufficient permissions or wrong role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              example:
                role: USER
  /api/v1/users/me/ride-requests:
    get:
      tags:
      - Users
      summary: List passenger's ride requests
      description: Returns paginated list of ride requests created by the authenticated
        passenger.
      operationId: get__api_v1_users_me_ride_requests
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardSuccessResponse'
        '400':
          description: Validation Error / Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '401':
          description: Unauthorized - Missing or expired session token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '403':
          description: Forbidden - Insufficient permissions or wrong role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
      security:
      - bearerAuth: []
      parameters:
      - name: status
        in: query
        required: false
        description: PENDING | ACCEPTED | REJECTED | CANCELLED | EXPIRED
        schema:
          type: string
          example: PENDING
      - name: page
        in: query
        required: false
        description: Page number
        schema:
          type: integer
          example: 1
      - name: limit
        in: query
        required: false
        description: Page limit (max 50)
        schema:
          type: integer
          example: 20
  /api/v1/users/me/rides:
    get:
      tags:
      - Users
      summary: List passenger's completed/active rides
      description: Retrieves past journeys taken by the passenger.
      operationId: get__api_v1_users_me_rides
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardSuccessResponse'
        '400':
          description: Validation Error / Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '401':
          description: Unauthorized - Missing or expired session token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '403':
          description: Forbidden - Insufficient permissions or wrong role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
      security:
      - bearerAuth: []
      parameters:
      - name: status
        in: query
        required: false
        description: Ride status filter
        schema:
          type: string
          example: COMPLETED
      - name: page
        in: query
        required: false
        description: Page number
        schema:
          type: integer
          example: 1
      - name: limit
        in: query
        required: false
        description: Items per page
        schema:
          type: integer
          example: 20
  /api/v1/users/me/emergency-contacts:
    get:
      tags:
      - Users
      summary: List trusted SOS emergency contacts
      description: Lists up to 5 emergency contacts configured for automated SOS dispatches.
      operationId: get__api_v1_users_me_emergency_contacts
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardSuccessResponse'
        '400':
          description: Validation Error / Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '401':
          description: Unauthorized - Missing or expired session token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '403':
          description: Forbidden - Insufficient permissions or wrong role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
      security:
      - bearerAuth: []
    post:
      tags:
      - Users
      summary: Create trusted SOS emergency contact
      description: Registers a new emergency contact. Maximum 5 contacts per user.
      operationId: post__api_v1_users_me_emergency_contacts
      responses:
        '201':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardSuccessResponse'
        '400':
          description: Validation Error / Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '401':
          description: Unauthorized - Missing or expired session token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '403':
          description: Forbidden - Insufficient permissions or wrong role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              example:
                name: Priya Sharma
                phoneNumber: '+919876543211'
                relationship: FAMILY
  /api/v1/users/me/emergency-contacts/{contactId}:
    patch:
      tags:
      - Users
      summary: Update emergency contact
      description: Modifies name, phone number, or relationship for an owned contact.
      operationId: patch__api_v1_users_me_emergency_contacts__contactid
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardSuccessResponse'
        '400':
          description: Validation Error / Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '401':
          description: Unauthorized - Missing or expired session token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '403':
          description: Forbidden - Insufficient permissions or wrong role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
      security:
      - bearerAuth: []
      parameters:
      - name: contactId
        in: path
        required: true
        description: Emergency contact ObjectId
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              example:
                name: Priya Sharma
                relationship: FRIEND
    delete:
      tags:
      - Users
      summary: Delete emergency contact
      description: Soft-deletes the specified emergency contact.
      operationId: delete__api_v1_users_me_emergency_contacts__contactid
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardSuccessResponse'
        '400':
          description: Validation Error / Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '401':
          description: Unauthorized - Missing or expired session token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '403':
          description: Forbidden - Insufficient permissions or wrong role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
      security:
      - bearerAuth: []
      parameters:
      - name: contactId
        in: path
        required: true
        description: Emergency contact ObjectId
        schema:
          type: string
  /api/v1/drivers/me/profile:
    get:
      tags:
      - Drivers
      summary: Get authenticated driver profile
      description: Returns driver profile including masked license number and verification
        status.
      operationId: get__api_v1_drivers_me_profile
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardSuccessResponse'
        '400':
          description: Validation Error / Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '401':
          description: Unauthorized - Missing or expired session token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '403':
          description: Forbidden - Insufficient permissions or wrong role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
      security:
      - bearerAuth: []
    post:
      tags:
      - Drivers
      summary: Initialize driver verification profile
      description: Creates initial DriverProfile record for caller with DRIVER_CONDUCTOR
        role.
      operationId: post__api_v1_drivers_me_profile
      responses:
        '201':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardSuccessResponse'
        '400':
          description: Validation Error / Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '401':
          description: Unauthorized - Missing or expired session token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '403':
          description: Forbidden - Insufficient permissions or wrong role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              example:
                licenseNumber: MH1220210098765
                yearsOfExperience: 5
                emergencyContact:
                  name: Rajesh Kumar
                  phoneNumber: '+919876500000'
    patch:
      tags:
      - Drivers
      summary: Update driver experience or contact
      description: Updates non-regulated profile fields.
      operationId: patch__api_v1_drivers_me_profile
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardSuccessResponse'
        '400':
          description: Validation Error / Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '401':
          description: Unauthorized - Missing or expired session token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '403':
          description: Forbidden - Insufficient permissions or wrong role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
      security:
      - bearerAuth: []
